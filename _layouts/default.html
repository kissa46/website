<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="light-mode">
    <div class="header">
        <div class="header-wrapper">
            {% if page.url != "/" %}
                <a href="{{ '/' | relative_url }}" class="header-back" aria-label="Back">
                    <svg class="header-back-icon" width="16" height="16" viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" shape-rendering="crispEdges">
                        <rect x="3" y="0" width="2" height="1" fill="currentColor"/>
                        <rect x="2" y="1" width="2" height="1" fill="currentColor"/>
                        <rect x="1" y="2" width="2" height="1" fill="currentColor"/>
                        <rect x="0" y="3" width="2" height="1" fill="currentColor"/>
                        <rect x="1" y="4" width="2" height="1" fill="currentColor"/>
                        <rect x="2" y="5" width="2" height="1" fill="currentColor"/>
                        <rect x="3" y="6" width="2" height="1" fill="currentColor"/>
                    </svg>
                </a>
            {% endif %}
        </div>
    </div>

    <main>
        {{ content }}
    </main>
</body>
</html>
